<svg xmlns="http://www.w3.org/2000/svg" width="259" height="125" viewBox="0 0 259 125">
  <defs>
    <linearGradient id="glass-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.60" />
      <stop offset="100%" stop-color="#e4eaf2" stop-opacity="0.30" />
    </linearGradient>
    <linearGradient id="glass-shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.90" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <filter id="pill-shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#7a8ba3" flood-opacity="0.08" />
    </filter>
  </defs>

  <rect x="0" y="0" width="259" height="125" rx="12" ry="12" fill="#F2F1EF" />
  <rect x="0" y="0" width="259" height="125" rx="12" ry="12" fill="#FBFBFA" stroke="#E4E4E2" stroke-width="1" />

  <!-- Title pill -->
  <g filter="url(#pill-shadow)">
    <rect x="74" y="16" width="110" height="28" rx="14" fill="url(#glass-bg)" stroke="#ffffff" stroke-opacity="0.9" stroke-width="0.8" />
    <rect x="74" y="16" width="110" height="14" rx="14" fill="url(#glass-shine)" />
  </g>
  <text x="129" y="35" text-anchor="middle" font-family="'SF Pro Display','Geist Sans','Helvetica Neue',sans-serif"
        font-size="12" font-weight="600" fill="#2F3437" letter-spacing="2.5">圣芙蕾雅</text>

  <line x1="14" y1="58" x2="245" y2="58" stroke="#E4E4E2" stroke-width="1" />

  <!-- UV pill -->
  <g filter="url(#pill-shadow)">
    <rect x="43" y="76" width="76" height="30" rx="15" fill="url(#glass-bg)" stroke="#ffffff" stroke-opacity="0.9" stroke-width="0.8" />
    <rect x="43" y="76" width="76" height="15" rx="15" fill="url(#glass-shine)" />
  </g>
  <text x="81" y="96" text-anchor="middle" font-family="'Geist Mono','SF Mono','JetBrains Mono',monospace"
        font-size="12" font-weight="500" fill="#2F3437" letter-spacing="0.5">UV: 3</text>

  <!-- PV pill -->
  <g filter="url(#pill-shadow)">
    <rect x="140" y="76" width="76" height="30" rx="15" fill="url(#glass-bg)" stroke="#ffffff" stroke-opacity="0.9" stroke-width="0.8" />
    <rect x="140" y="76" width="76" height="15" rx="15" fill="url(#glass-shine)" />
  </g>
  <text x="178" y="96" text-anchor="middle" font-family="'Geist Mono','SF Mono','JetBrains Mono',monospace"
        font-size="12" font-weight="500" fill="#2F3437" letter-spacing="0.5">PV: 9</text>
</svg>